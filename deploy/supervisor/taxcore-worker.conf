; Dedicated failsafe worker for TaxCore fiscal queue.
; This runs INDEPENDENTLY of Horizon so that if Horizon crashes or restarts,
; fiscal invoices continue processing without interruption.
;
; CRITICAL: maxprocs=1 — serial execution is required by the E-SDC PIN model.
; If you add a second E-SDC instance, duplicate this block and change:
;   - program name  →  taxcore-worker-branch2
;   - --queue value →  taxcore:branch2

[program:taxcore-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=taxcore:default,taxcore-retry --tries=4 --timeout=60 --sleep=1 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/taxcore-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=3600
; Graceful shutdown: wait up to 1h so an in-progress fiscalization completes.

